name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Route auth guard
        run: npm run check:route-auth
      - name: GymAdvisor delta save tests
        run: |
          set -euo pipefail
          for file in \
            lib/fitness/brief110-gym-delta-saves.test.ts \
            lib/fitness/brief52-calendar-patch-save.test.ts \
            lib/fitness/brief55-public-patch-save.test.ts \
            lib/b2c/brief57-care-gym-live-store.test.ts \
            lib/fitness/brief54-desk-patch-save.test.ts \
            lib/fitness/brief56-desk-get-window.test.ts \
            lib/fitness/gym-booking-plan.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Security string-scan smoke tests
        run: |
          set -euo pipefail
          for file in \
            lib/security/brief83-authz.test.ts \
            lib/security/brief84-storage.test.ts \
            lib/security/brief85-authz.test.ts \
            lib/storage/resolve-stored-doc.test.ts \
            lib/auth/public-paths.test.ts \
            lib/insights/visitor.test.ts \
            lib/http/brief105-public-mailers.test.ts \
            lib/trades/brief108-public-feeds.test.ts \
            lib/trades/brief109-otp.test.ts \
            lib/recovery/brief111-roles.test.ts \
            lib/recovery/brief111-permissions.test.ts \
            lib/recovery/brief111-registration.test.ts \
            lib/recovery/brief111-real-data-guard.test.ts \
            lib/recovery/brief111-api-gates.test.ts \
            lib/recovery/brief111-portal-shells.test.ts
          do
            if [ -f "$file" ]; then
              npx --yes tsx "$file"
            else
              echo "Skipping missing test: $file"
            fi
          done

  trade-portal-db:
    name: trade portal Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradegraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run trade_portal_call against Postgres
        env:
          TRADE_PORTAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradegraph
        run: npx --yes tsx lib/trades/trade-portal-call.test.ts

  recover-portal-db:
    name: recover portal Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovergraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovergraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run recover portal functions against Postgres
        env:
          RECOVER_PORTAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recovergraph
        run: npx --yes tsx lib/recovery/recover-portal-call.test.ts
