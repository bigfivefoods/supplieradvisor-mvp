name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Route auth guard
        run: npm run check:route-auth
      - name: GymAdvisor delta save tests
        run: |
          set -euo pipefail
          for file in \
            lib/fitness/brief110-gym-delta-saves.test.ts \
            lib/fitness/brief52-calendar-patch-save.test.ts \
            lib/fitness/brief55-public-patch-save.test.ts \
            lib/b2c/brief57-care-gym-live-store.test.ts \
            lib/fitness/brief54-desk-patch-save.test.ts \
            lib/fitness/brief56-desk-get-window.test.ts \
            lib/fitness/gym-booking-plan.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: ConstructionAdvisor tests
        run: |
          set -euo pipefail
          for file in \
            lib/construction/constructiongraph.test.ts \
            lib/construction/constructiongraph-authz.test.ts \
            lib/construction/constructiongraph-naming.test.ts \
            lib/construction/brief113-backward.test.ts \
            lib/construction/brief113-roles.test.ts \
            lib/construction/brief113-programme.test.ts \
            lib/construction/brief113-variations.test.ts \
            lib/construction/brief113-diary.test.ts \
            lib/construction/brief113-safety.test.ts \
            lib/construction/brief113-portal.test.ts \
            lib/construction/brief113-brand.test.ts \
            lib/construction/brief113-ui-parity.test.ts \
            lib/construction/brief113-preview.test.ts \
            lib/chrome/construction-sidebar.test.ts \
            lib/chrome/fleet-sidebar.test.ts \
            lib/fleet/brief114-registration.test.ts \
            lib/fleet/brief114-roles.test.ts \
            lib/fleet/brief114-cpk.test.ts \
            lib/fleet/brief114-compliance.test.ts \
            lib/fleet/brief114-validation.test.ts \
            lib/fleet/brief114-tokens.test.ts \
            lib/fleet/brief114-api-security.test.ts \
            lib/fleet/brief114-brand.test.ts \
            lib/fleet/brief114-ui-parity.test.ts \
            lib/fleet/brief114-preview.test.ts \
            lib/fleet/brief114-ops.test.ts \
            lib/fleet/brief115-assignable.test.ts \
            lib/fleet/brief115-compliance-centre.test.ts \
            lib/fleet/brief115-reminders.test.ts \
            lib/fleet/brief115-cron-route.test.ts \
            lib/fleet/brief115-csv.test.ts \
            lib/fleet/brief115-import.test.ts \
            lib/fleet/brief115-permits.test.ts \
            lib/fleet/brief115-roles.test.ts \
            lib/fleet/brief115-api-security.test.ts \
            lib/fleet/brief115-brand.test.ts \
            lib/fleet/brief115-ui-parity.test.ts \
            lib/fleet/brief115-root-layout.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Security string-scan smoke tests
        run: |
          set -euo pipefail
          for file in \
            lib/security/brief83-authz.test.ts \
            lib/security/brief84-storage.test.ts \
            lib/security/brief85-authz.test.ts \
            lib/storage/resolve-stored-doc.test.ts \
            lib/auth/public-paths.test.ts \
            lib/insights/visitor.test.ts \
            lib/insights/collect.test.ts \
            lib/http/brief105-public-mailers.test.ts \
            lib/trades/brief108-public-feeds.test.ts \
            lib/trades/brief109-otp.test.ts \
            lib/recovery/brief111-roles.test.ts \
            lib/recovery/brief111-permissions.test.ts \
            lib/recovery/brief111-registration.test.ts \
            lib/recovery/brief111-real-data-guard.test.ts \
            lib/recovery/brief111-api-gates.test.ts \
            lib/recovery/brief111-portal-shells.test.ts \
            lib/recovery/brief111-preview.test.ts \
            lib/recovery/brief111-sample-scope.test.ts \
            lib/recovery/brief116-pii.test.ts \
            lib/recovery/brief116-sa-id.test.ts \
            lib/recovery/brief116-normalise.test.ts \
            lib/recovery/brief116-import-book.test.ts \
            lib/recovery/brief116-duplicates.test.ts \
            lib/recovery/brief116-roles.test.ts \
            lib/recovery/brief116-api-security.test.ts \
            lib/recovery/brief116-demo-book.test.ts \
            lib/recovery/brief116-pwa.test.ts \
            lib/recovery/brief116-brand.test.ts \
            lib/recovery/brief116-ui-parity.test.ts \
            lib/recovery/brief117-process-flow.test.ts \
            lib/recovery/brief117-process-flow-roles.test.ts \
            lib/recovery/brief117-book-stats.test.ts \
            lib/recovery/brief117-accounts-state-link.test.ts \
            lib/recovery/brief117-process-flow-ui.test.ts \
            lib/recovery/brief117-scope.test.ts \
            lib/chrome/trade-sidebar.test.ts \
            lib/onboarding/brief118-write-order.test.ts \
            lib/billing/brief118-access.test.ts \
            lib/onboarding/brief118-profile-columns.test.ts \
            lib/onboarding/register-profile.test.ts \
            lib/marketing/brief121a-no-link-to-static-html.test.ts \
            lib/db/brief122-duplicate-indexes.test.ts
          do
            if [ -f "$file" ]; then
              if [ "$file" = "lib/recovery/brief116-pii.test.ts" ]; then
                NODE_OPTIONS="${NODE_OPTIONS:-} --conditions=react-server" npx --yes tsx "$file"
              else
                npx --yes tsx "$file"
              fi
            else
              echo "::error::Missing test file: $file"
              exit 1
            fi
          done
      - name: Advisor process flow tests
        run: |
          set -e
          for file in \
            lib/advisors/process-flows/brief121-closed-client.test.ts \
            lib/advisors/process-flows/brief121-closed-by-default.test.ts \
            lib/advisors/process-flows/brief120-flow-data.test.ts \
            lib/advisors/process-flows/brief120-flow-routes.test.ts \
            lib/advisors/process-flows/brief120-flow-resolve.test.ts \
            lib/advisors/process-flows/brief120-flow-ui.test.tsx \
            lib/advisors/process-flows/brief120-flow-brand.test.ts \
            lib/advisors/process-flows/brief120-flow-mounts.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Core process flow tests
        run: |
          set -e
          for file in \
            lib/advisors/process-flows/brief121-core-data.test.ts \
            lib/advisors/process-flows/brief121-core-routes.test.ts \
            lib/advisors/process-flows/brief121-core-caps.test.ts \
            lib/advisors/process-flows/brief121-core-resolve.test.ts \
            lib/advisors/process-flows/brief121-core-ui.test.ts \
            lib/advisors/process-flows/brief121-core-client.test.ts \
            lib/advisors/process-flows/brief121-core-brand.test.ts \
            lib/advisors/process-flows/brief121-core-mounts.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Catalogue tests
        run: |
          set -euo pipefail
          for file in \
            lib/brief119-catalogues.test.ts \
            lib/brief119-home-static.test.ts \
            lib/brief119-catalogue-downloads.test.ts \
            components/catalogues/brief119-catalogues.render.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Brief 122 E2 seed guard tests
        run: |
          set -euo pipefail
          npx --yes tsx scripts/loadtest/seed.test.ts
      - name: ConstructionAdvisor portal tests
        run: |
          set -euo pipefail
          for file in \
            lib/construction/constructiongraph.test.ts \
            lib/construction/constructiongraph-authz.test.ts \
            lib/construction/constructiongraph-naming.test.ts \
            lib/construction/brief112-portal-tokens.test.ts \
            lib/construction/brief112-portal-views.test.ts \
            lib/construction/brief112-portal-routes.test.ts \
            lib/construction/brief112-staff-route.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Brief 122 E1 loadtest guard tests
        run: |
          set -euo pipefail
          for file in \
            loadtest/lib/guard.test.ts \
            lib/loadtest/whoami.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Brief 122 E3 staging auth tests
        run: |
          set -euo pipefail
          npx --yes tsx lib/loadtest/staging-auth.test.ts
      - name: Brief 122 F1 request timing tests
        run: |
          set -euo pipefail
          for file in \
            lib/observability/request-timing.test.ts \
            lib/observability/request-timing-client-graph.test.ts
          do
            npx --yes tsx "$file"
          done
      - name: Brief 122 D0 preview guard tests
        run: |
          set -euo pipefail
          npx --yes tsx lib/system/env-guard.test.ts
      - name: Bank transaction column tests
        run: |
          set -euo pipefail
          npx --yes tsx lib/banking/bank-transaction-columns.test.ts

  trade-portal-db:
    name: trade portal Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradegraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run trade_portal_call against Postgres
        env:
          TRADE_PORTAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradegraph
        run: npx --yes tsx lib/trades/trade-portal-call.test.ts

