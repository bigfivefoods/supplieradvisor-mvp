<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00b4d8" />
    <title>Offline · TradeAdvisor®</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .bar { height: 8px; background: #00b4d8; }
      main { padding: 28px 20px 40px; max-width: 28rem; }
      h1 { font-size: 1.6rem; margin: 12px 0; }
      p { color: #334155; line-height: 1.5; }
      button, a {
        display: inline-block;
        margin-top: 16px;
        background: #00b4d8;
        color: white;
        text-decoration: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <main>
      <p style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#00b4d8;font-weight:700">TradeAdvisor®</p>
      <h1>You are offline</h1>
      <p>Job progress, your statement and new requests need a connection. Reconnect, then open the app again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
